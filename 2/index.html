<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>楊老師的星座週報 11/2–11/8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFE8FF; --paper:#FFFFFF; --ink:#3A2E5C; --soft:#7A6E9C;
  --pink:#FF8FB8; --mint:#8EE0C2; --butter:#FFE07A; --sky:#9CC8FF; --lilac:#C9B5FF;
  --line:#3A2E5C; --shadow:#3A2E5C;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1F1A3A; --paper:#2C2550; --ink:#F4EEFF; --soft:#B8ADDC;
    --pink:#FF7AAA; --mint:#5FC9A4; --butter:#F2CC4F; --sky:#6FA8EE; --lilac:#9C84E8;
    --line:#F4EEFF; --shadow:#0E0B20; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1F1A3A; --paper:#2C2550; --ink:#F4EEFF; --soft:#B8ADDC;
  --pink:#FF7AAA; --mint:#5FC9A4; --butter:#F2CC4F; --sky:#6FA8EE; --lilac:#9C84E8;
  --line:#F4EEFF; --shadow:#0E0B20; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:17px; line-height:1.7;
  background-image:radial-gradient(var(--lilac) 1.5px,transparent 1.6px);
  background-size:28px 28px;
}
.wrap{max-width:980px;margin:0 auto;padding:28px 18px 60px}
header{text-align:center;padding:12px 0 8px}
.moon{font-size:46px;display:inline-block;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-6deg)}}
h1{
  font-size:clamp(34px,7vw,58px); line-height:1.15; margin:6px 0 4px; letter-spacing:.04em;
  color:var(--ink);
  text-shadow:3px 3px 0 var(--pink),6px 6px 0 var(--butter);
}
.week{
  display:inline-block;background:var(--paper);border:2.5px solid var(--line);
  border-radius:999px;padding:4px 18px;margin-top:10px;font-size:16px;
  box-shadow:3px 3px 0 var(--shadow);
}
.hint{color:var(--soft);margin:14px 0 22px;font-size:16px}

/* sticker grid */
.signs{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;list-style:none;padding:0;margin:0}
@media (max-width:720px){.signs{grid-template-columns:repeat(4,1fr)}}
@media (max-width:420px){.signs{grid-template-columns:repeat(3,1fr)}}
.sign{
  appearance:none;font:inherit;color:var(--ink);cursor:pointer;width:100%;
  background:var(--paper);border:2.5px solid var(--line);border-radius:22px;
  padding:10px 4px 8px;text-align:center;box-shadow:4px 4px 0 var(--shadow);
  transition:transform .15s,box-shadow .15s;
}
.sign:nth-child(4n+1){transform:rotate(-2deg)}
.sign:nth-child(4n+3){transform:rotate(2deg)}
.sign:hover{transform:translateY(-3px) rotate(0)}
.sign[aria-pressed="true"]{background:var(--butter);transform:translate(2px,2px) rotate(0);box-shadow:2px 2px 0 var(--shadow)}
.sign:focus-visible{outline:3px dashed var(--pink);outline-offset:4px}
.sign .em{font-size:34px;display:block;line-height:1.2}
.sign .nm{font-size:16px;display:block}
.sign .dt{font-size:12px;color:var(--soft);display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sign[aria-pressed="true"] .dt{color:#3A2E5C}:root:not([data-theme="light"]) .sign[aria-pressed="true"]{color:#3A2E5C}}
:root[data-theme="dark"] .sign[aria-pressed="true"]{color:#3A2E5C}
:root[data-theme="dark"] .sign[aria-pressed="true"] .dt{color:#3A2E5C}

.finder{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin:22px 0 6px}
.finder label{color:var(--soft);font-size:15px}
.finder input{
  font:inherit;font-size:15px;color:var(--ink);background:var(--paper);
  border:2.5px solid var(--line);border-radius:14px;padding:4px 10px;
}
.finder input:focus-visible{outline:3px dashed var(--pink);outline-offset:2px}

/* card */
.card{
  margin-top:30px;background:var(--paper);border:3px solid var(--line);border-radius:32px;
  box-shadow:8px 8px 0 var(--shadow);padding:26px clamp(18px,4vw,40px) 30px;position:relative;
}
.card.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.96);opacity:.4}100%{transform:scale(1);opacity:1}}
.top{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.big{
  font-size:64px;width:104px;height:104px;display:grid;place-items:center;flex:none;
  border-radius:50%;border:3px solid var(--line);background:var(--pink);
}
.top h2{margin:0;font-size:34px;line-height:1.2}
.top .sub{color:var(--soft);font-size:15px}
.overall{font-size:22px;letter-spacing:2px;margin-top:2px}
.summary{
  background:var(--bg);border-radius:20px;padding:14px 18px;margin:20px 0 6px;
  font-size:18px;max-width:72ch;
}
.areas{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}
@media (max-width:620px){.areas{grid-template-columns:1fr}}
.area{border:2.5px solid var(--line);border-radius:22px;padding:12px 16px}
.area h3{margin:0 0 2px;font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.area p{margin:4px 0 0;font-size:16px}
.area.love{background:color-mix(in srgb,var(--pink) 28%,var(--paper))}
.area.work{background:color-mix(in srgb,var(--sky) 30%,var(--paper))}
.area.money{background:color-mix(in srgb,var(--butter) 38%,var(--paper))}
.area.health{background:color-mix(in srgb,var(--mint) 32%,var(--paper))}
.dots{font-size:15px;letter-spacing:1px;white-space:nowrap}

.mood h3,.lucky h3,.tip h3{font-size:19px;margin:26px 0 10px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px;padding:0 2px}
.day{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bar{
  width:100%;max-width:44px;border:2.5px solid var(--line);border-radius:14px 14px 8px 8px;
  background:var(--lilac);transform-origin:bottom;animation:grow .6s cubic-bezier(.3,1.4,.6,1) both;
}
.bar.hi{background:var(--pink)}
@keyframes grow{from{transform:scaleY(0)}}
.day .lb{font-size:13px;color:var(--soft);text-align:center;line-height:1.3}
.day .face{font-size:18px;line-height:1}

.lucky .row{display:flex;flex-wrap:wrap;gap:10px}
.chip{
  border:2.5px solid var(--line);border-radius:999px;padding:6px 14px;background:var(--paper);
  display:flex;align-items:center;gap:8px;font-size:16px;
}
.swatch{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:inline-block}
.tip{
  margin-top:8px;position:relative;
}
.bubble{
  display:flex;gap:12px;align-items:flex-start;
}
.ling{
  flex:none;width:52px;height:52px;border-radius:50%;background:var(--butter);
  border:2.5px solid var(--line);display:grid;place-items:center;font-size:28px;
}
.say{
  background:var(--bg);border-radius:4px 22px 22px 22px;padding:12px 16px;font-size:17px;max-width:64ch;
}
footer{text-align:center;color:var(--soft);font-size:13px;margin-top:34px}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>

const ul=document.getElementById("signs");
const card=document.getElementById("card");
S.forEach(s=>{
  const li=document.createElement("li");
  li.innerHTML=`<button class="sign" type="button" aria-pressed="false" data-id="${s.id}">
    <span class="em" aria-hidden="true">${s.em}</span><span class="nm">${s.nm}</span><span class="dt">${s.dt}</span></button>`;
  ul.appendChild(li);
});
ul.addEventListener("click",e=>{
  const b=e.target.closest(".sign"); if(!b)return;
  select(b.dataset.id);
});

const stars=n=>"★".repeat(n)+"☆".repeat(5-n);
const hearts=(n,on,off)=>on.repeat(n)+off.repeat(5-n);

function render(id){
  const s=S.find(x=>x.id===id)||S[7];
  document.querySelectorAll(".sign").forEach(b=>b.setAttribute("aria-pressed",b.dataset.id===s.id));
  const max=Math.max(...s.mood);
  card.innerHTML=`
    <div class="top">
      <div class="big" aria-hidden="true">${s.em}</div>
      <div>
        <h2>${s.nm}</h2>
        <div class="sub">${s.dt}　本週整體運勢</div>
        <div class="overall" aria-label="整體 ${s.ov} 顆星">${stars(s.ov)}</div>
      </div>
    </div>
    <p class="summary">${s.sum}</p>
    <div class="areas">
      <div class="area love"><h3>💗 愛情 <span class="dots" aria-label="${s.love[0]} 分">${hearts(s.love[0],"♥","♡")}</span></h3><p>${s.love[1]}</p></div>
      <div class="area work"><h3>💼 工作 <span class="dots" aria-label="${s.work[0]} 分">${stars(s.work[0])}</span></h3><p>${s.work[1]}</p></div>
      <div class="area money"><h3>💰 財運 <span class="dots" aria-label="${s.money[0]} 分">${hearts(s.money[0],"●","○")}</span></h3><p>${s.money[1]}</p></div>
      <div class="area health"><h3>🌿 健康 <span class="dots" aria-label="${s.health[0]} 分">${hearts(s.health[0],"✿","❀")}</span></h3><p>${s.health[1]}</p></div>
    </div>
    <div class="mood">
      <h3>每日心情曲線</h3>
      <div class="days">
        ${s.mood.map((m,i)=>`<div class="day" aria-label="${DAYS[i]} 心情 ${m} 分">
          <span class="face" aria-hidden="true">${FACES[m]}</span>
          <div class="bar ${m===max?"hi":""}" style="height:${m*18}px;animation-delay:${i*60}ms"></div>
          <span class="lb">${DAYS[i]}<br>${DATES[i]}</span></div>`).join("")}
      </div>
    </div>
    <div class="lucky">
      <h3>本週幸運小物</h3>
      <div class="row">
        <span class="chip"><span class="swatch" style="background:${s.color[1]}"></span>幸運色 ${s.color[0]}</span>
        <span class="chip">🔢 幸運數字 ${s.num}</span>
        <span class="chip">🎀 幸運物 ${s.item}</span>
        <span class="chip">📅 最旺的一天 ${DAYS[s.mood.indexOf(max)]}</span>
      </div>
    </div>
    <div class="tip">
      <h3>阿玲悄悄話</h3>
      <div class="bubble"><div class="ling" aria-hidden="true">🐰</div><p class="say">${s.tip}</p></div>
    </div>`;
  card.classList.remove("pop"); void card.offsetWidth; card.classList.add("pop");
}

function signFromDate(v){
  if(!v)return null;
  const [,m,d]=v.split("-").map(Number); const md=m*100+d;
  const r=[[120,"capricorn"],[219,"aquarius"],[321,"pisces"],[420,"aries"],[521,"taurus"],[622,"gemini"],
    [723,"cancer"],[823,"leo"],[923,"virgo"],[1024,"libra"],[1123,"scorpio"],[1222,"sagittarius"],[1232,"capricorn"]];
  for(const [lim,id] of r){ if(md<lim) return id; }
}
document.getElementById("bd").addEventListener("change",e=>{
  const id=signFromDate(e.target.value); if(id) select(id);
});

function select(id){
  render(id);
  try{ card.scrollIntoView({behavior:"smooth",block:"start"}); }catch(err){}
}
let startId="scorpio";
try{
  const h=(window.location.hash||"").slice(1);
  if(S.some(s=>s.id===h)) startId=h;
}catch(err){}
render(startId);
</script>
</body>
</html>
