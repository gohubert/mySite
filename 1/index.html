<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1025"><title>星語塔羅｜你的心靈指引</title>
<style>
:root{color-scheme:dark;--gold:#e7c98d;--muted:#adb3c9;--bg:#090d20;--surface:#151a35;--line:#393955}*{box-sizing:border-box}body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#f8f1e7;background:radial-gradient(ellipse at 50% -10%,#33325d 0%,#141831 38%,#090d20 80%);min-height:100vh}body:before{content:"";pointer-events:none;position:fixed;inset:0;background-image:radial-gradient(#e6d8ba88 .7px,transparent .7px);background-size:38px 38px;opacity:.25}.shell{position:relative;max-width:1120px;margin:auto;padding:32px 22px 80px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{color:var(--gold);letter-spacing:.22em;font-size:13px;font-weight:700}.historybtn{color:var(--muted);border:1px solid #52516a;background:#ffffff08;border-radius:30px;padding:10px 16px;cursor:pointer}header{text-align:center;padding:47px 0 22px}.eyebrow{letter-spacing:.32em;color:var(--gold);font-size:12px}h1{font-family:Georgia,"Noto Serif TC",serif;font-size:clamp(36px,6vw,66px);font-weight:500;letter-spacing:.13em;margin:17px 0}header p{color:#b9bdd0;line-height:1.9;margin:0}.divider{width:110px;margin:25px auto;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}.panel{border:1px solid #77708a55;border-radius:22px;background:linear-gradient(140deg,#1c203bca,#13172ddd);box-shadow:0 18px 70px #03051566;padding:27px;backdrop-filter:blur(10px)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.label{display:block;color:var(--gold);font-size:13px;margin-bottom:10px;letter-spacing:.1em}.choices{display:flex;gap:10px;flex-wrap:wrap}.choice{flex:1;min-width:105px;cursor:pointer;color:#ded9e4;border:1px solid #56516f;background:#ffffff08;padding:13px 12px;border-radius:12px;text-align:center;transition:.2s}.choice.active{border-color:var(--gold);background:#d3a85a24;color:#ffdfab;box-shadow:inset 0 0 0 1px #e4c08235}.question{margin-top:23px}textarea{background:#0d1229;color:#fff;border:1px solid #55516b;border-radius:12px;padding:15px;resize:vertical;width:100%;min-height:86px;font:inherit;outline:none}textarea:focus{border-color:var(--gold)}.tip{color:#999eb6;font-size:12px;margin:8px 0 0}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:27px 0 0}.btn{border-radius:999px;padding:15px 32px;font:inherit;cursor:pointer;transition:.2s}.btn:hover{transform:translateY(-2px)}.primary{background:linear-gradient(135deg,#f6dca7,#cda767);border:0;color:#282034;font-weight:800;letter-spacing:.1em;box-shadow:0 8px 30px #d6b66d30}.secondary{border:1px solid #8d8190;background:#ffffff0a;color:#e6d7c1}.status{text-align:center;min-height:29px;color:var(--gold);font-size:14px;margin-top:18px}.reading{padding-top:35px;text-align:center}.reading h2{font-family:Georgia,"Noto Serif TC",serif;font-weight:500;letter-spacing:.13em;font-size:27px;margin:6px 0 8px}.reading .sub{color:var(--muted);font-size:13px}.cards{display:flex;justify-content:center;flex-wrap:wrap;gap:25px;margin:35px auto 30px}.cardunit{width:210px;max-width:100%;animation:rise .6s both}.position{color:var(--gold);letter-spacing:.1em;font-size:13px;margin-bottom:13px}.tarot{height:315px;width:198px;margin:auto;perspective:900px}.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.2,.7,.2,1)}.tarot.revealed .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;border:5px solid #e2c389;outline:1px solid #7a6599;outline-offset:3px;overflow:hidden;box-shadow:0 12px 24px #0008}.back{background:radial-gradient(circle,#414575,#1b2044 75%);display:flex;align-items:center;justify-content:center}.back:before{content:"";position:absolute;inset:9px;border:1px solid #e9ca8f88;border-radius:4px}.back .ornament{font-size:79px;color:#ebce9f;text-shadow:0 0 28px #f7d8a088}.front{transform:rotateY(180deg);background:linear-gradient(165deg,#eae0cc,#c3b7ae);color:#383145;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:17px 8px 18px}.front.reversed .symbol{transform:rotate(180deg)}.number{font-family:Georgia,serif;letter-spacing:.2em;font-size:13px}.symbol{font-size:90px;filter:drop-shadow(0 6px 5px #0003);line-height:1.2}.cardname{font-family:Georgia,"Noto Serif TC",serif;font-size:19px;font-weight:bold}.cardmeta{font-size:12px;color:#584d69}.interpret{margin-top:18px;text-align:left;background:#171b34d9;border:1px solid #4e4666;border-radius:15px;padding:17px 16px;line-height:1.8}.interpret h3{color:#efd39e;font-size:16px;margin:0 0 8px}.keywords{color:#d6be90;font-size:12px;margin-bottom:9px}.interpret p{font-size:13px;color:#d0cbd6;margin:0}.summary{max-width:790px;text-align:left;margin:10px auto 0;border:1px solid #6d617b;border-radius:15px;background:#27264070;padding:21px;line-height:1.9}.summary strong{color:var(--gold)}.summary p{color:#d0cad7;margin:5px 0 0}.footer{text-align:center;margin:46px auto;color:#8589a1;font-size:12px;line-height:1.8}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#02040bdc;display:grid;place-items:center;z-index:10;padding:20px}.modalbox{width:min(580px,100%);background:#1a1d37;border:1px solid #a18b6e;border-radius:19px;padding:24px;max-height:82vh;overflow:auto}.modalbox h2{color:var(--gold);margin:0 0 15px}.entry{border-bottom:1px solid #44415c;padding:14px 0;color:#ddd}.entry small{color:#a9a5ba}.close{float:right;cursor:pointer;border:0;background:none;color:#fff;font-size:23px}@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}@media(max-width:680px){.formgrid{grid-template-columns:1fr}.shell{padding:20px 15px 55px}header{padding-top:32px}.panel{padding:20px 15px}.cardunit{width:min(100%,290px)}.tarot{width:190px;height:305px}.cards{gap:32px}}
</style>
</head>
<body>
<main class="shell"><div class="top"><div class="brand">✦ ASTRA TAROT</div><button class="historybtn" id="historyBtn">☾ 占卜紀錄</button></div>
<header><div class="eyebrow">✦ LISTEN TO YOUR INNER VOICE ✦</div><h1>星語塔羅</h1><p>在星辰與直覺之間，尋找此刻的答案。<br>靜下心來，讓塔羅為你照亮下一步。</p><div class="divider"></div></header>
<section class="panel" aria-label="占卜設定"><div class="formgrid"><div><span class="label">01　選擇占卜主題</span><div class="choices" id="topics"><button class="choice active" data-value="綜合指引">✧ 綜合</button><button class="choice" data-value="感情關係">♡ 感情</button><button class="choice" data-value="工作事業">✦ 事業</button><button class="choice" data-value="財務規劃">✧ 財運</button></div></div><div><span class="label">02　選擇牌陣</span><div class="choices" id="spreads"><button class="choice active" data-value="1">單張指引</button><button class="choice" data-value="3">過去・現在・未來</button></div></div></div><div class="question"><label class="label" for="question">03　寫下你心中的問題 (選填)</label><textarea id="question" maxlength="220" placeholder="例如：面對目前的職涯選擇，我該留意什麼？"></textarea><p class="tip">建議以開放式問題提問。牌卡是自我探索工具，而非絕對的未來預言。</p></div><div class="actions"><button class="btn primary" id="drawBtn">✦　洗牌並抽取指引</button></div><div class="status" id="status" aria-live="polite"></div></section>
<section class="reading hidden" id="reading"><div class="eyebrow">✧ YOUR READING ✧</div><h2>宇宙給你的訊息</h2><div class="sub" id="readingSub"></div><div class="cards" id="cards"></div><div class="summary" id="summary"></div><div class="actions"><button class="btn secondary" id="againBtn">↻ 再抽一次</button><button class="btn secondary" id="saveBtn">♡ 儲存本次解讀</button></div></section>
<footer class="footer">✦ 靜心 · 覺察 · 自由選擇 ✦<br>塔羅解讀僅供娛樂與自我反思，不取代醫療、法律、財務等專業建議。<br>本網頁可完全離線使用，所有紀錄只保存在你的瀏覽器中。</footer></main>
<div class="modal hidden" id="modal"><div class="modalbox"><button class="close" id="closeModal" aria-label="關閉">×</button><h2>☾ 我的占卜紀錄</h2><div id="historyList"></div><div class="actions"><button class="btn secondary" id="clearHistory">清除紀錄</button></div></div></div>
<script>
'use strict';
const majorNames=['愚者','魔術師','女祭司','皇后','皇帝','教皇','戀人','戰車','力量','隱者','命運之輪','正義','倒吊人','死神','節制','惡魔','高塔','星星','月亮','太陽','審判','世界'];
const majorSymbols=['🌅','✨','🌙','🌷','👑','🗝️','💞','🏇','🦁','🏮','☸️','⚖️','🌿','🦋','🏺','⛓️','⚡','⭐','🌘','☀️','📯','🌍'];
const majorU=['新的開始與自由探索','主動創造與發揮潛能','傾聽直覺與內在智慧','滋養關係與豐盛成長','建立秩序與穩固基礎','學習傳統與尋求指引','價值一致與重要選擇','意志堅定與掌握方向','溫柔而堅定的勇氣','沉澱思緒與向內探索','接受轉機與生命循環','公平衡量與承擔責任','換位思考與暫時放下','結束舊章與迎接轉化','調和差異與保持耐心','辨認依附與限制模式','打破舊框架與重新建構','保持希望與修復能量','面對不確定與深層情緒','清晰喜悅與坦然表達','重新覺醒與回應召喚','整合成果與走向圓滿'];
const majorR=['重新檢視衝動與準備程度','留心分心或對能力的懷疑','避免忽略直覺與隱藏訊息','照顧自己並留意付出失衡','鬆開過度控制與僵化規則','重新思考不適合的既定框架','釐清價值衝突與關係選擇','調整失控節奏與方向感','正視自我懷疑或壓抑情緒','避免過度孤立並適時求助','接受變動並找回可控之處','檢查偏見與未解決的不平衡','從停滯中尋找新的視角','練習放下難以延續的過去','避免失衡與極端做法','察覺習慣性束縛並鬆綁','接納必要改變，穩住腳步','修復失望並重建信任','釐清誤解、焦慮與想像','允許短暫陰霾並尋找亮點','放下苛責並重新評估','整理未完成之事再往前'];
const suits=[{name:'權杖',sym:'🔥',theme:'行動、熱情與創造'},{name:'聖杯',sym:'🏆',theme:'情感、關係與直覺'},{name:'寶劍',sym:'⚔️',theme:'思考、溝通與抉擇'},{name:'錢幣',sym:'🪙',theme:'資源、工作與實際生活'}];
const ranks=['王牌','二','三','四','五','六','七','八','九','十','侍者','騎士','皇后','國王'];
const rankUp=['機會萌芽、開啟新局','平衡選項、做出規劃','合作拓展、逐步成形','建立基礎、安定節奏','面對磨合、學習調整','分享成果、重拾信心','評估挑戰、堅守原則','持續精進、保持專注','累積經驗、接近收穫','階段完成、承接責任','好奇學習、探索新知','採取行動、勇於前進','成熟照顧、穩健支持','掌握全局、負責領導'];
const rankRev=['起點尚未清晰、適合先整理','選擇搖擺、需要重新排序','合作卡關、重新建立共識','安穩過度、留心停滯','衝突消耗、練習適時退讓','成果延遲、校準期待','防備過強、檢查真正障礙','急躁或疲乏、調整步調','擔心失去、留意壓力來源','負擔過重、適時分工','資訊不足、先補足認知','衝得太快、留意後果','付出失衡、照顧自身需求','控制過度、適度授權'];
const deck=[...majorNames.map((name,i)=>({name,symbol:majorSymbols[i],number:String(i).padStart(2,'0'),up:majorU[i],rev:majorR[i],kind:'大阿爾克那'})),...suits.flatMap(s=>ranks.map((r,i)=>({name:s.name+'・'+r,symbol:s.sym,number:String(i+1).padStart(2,'0'),up:`${s.theme}：${rankUp[i]}`,rev:`${s.theme}：${rankRev[i]}`,kind:'小阿爾克那'})))];
let topic='綜合指引',count=1,current=null;const $=id=>document.getElementById(id);
function bindChoices(id,cb){$(id).addEventListener('click',e=>{let b=e.target.closest('button[data-value]');if(!b)return;$(id).querySelectorAll('.choice').forEach(n=>n.classList.toggle('active',n===b));cb(b.dataset.value)})}
bindChoices('topics',v=>topic=v);bindChoices('spreads',v=>count=Number(v));
function rand(n){if(globalThis.crypto?.getRandomValues){let x=new Uint32Array(1),limit=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(x)}while(x[0]>=limit);return x[0]%n}return Math.floor(Math.random()*n)}
function draw(){const pool=[...deck];const picks=[];for(let i=0;i<count;i++){const index=rand(pool.length);picks.push({...pool.splice(index,1)[0],reversed:rand(100)<35})}return picks}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function explain(c,pos){let sense=c.reversed?c.rev:c.up;let prompt=topic==='感情關係'?'試著從感受、需求與界線理解這份訊息。':topic==='工作事業'?'思考目前工作的目標、資源與下一步行動。':topic==='財務規劃'?'回頭檢視風險承受度、預算與實際選擇。':'對照你當下的處境，觀察哪些部分產生共鳴。';return `${pos}的訊息指向「${sense}」。${prompt}你可以先選擇一件能實際做到的小事。`}
function show(){const question=$('question').value.trim();const picks=draw(),positions=count===1?['此刻的指引']:['過去','現在','未來'];current={date:new Date().toLocaleString('zh-TW'),topic,question,positions,picks};$('readingSub').textContent=`${topic} · ${count===1?'單張指引':'過去・現在・未來'}`;$('cards').innerHTML=picks.map((c,i)=>`<article class="cardunit" style="animation-delay:${i*.16}s"><div class="position">✧ ${positions[i]} ✧</div><div class="tarot" id="tarot${i}"><div class="inner"><div class="face back"><div class="ornament">✺</div></div><div class="face front ${c.reversed?'reversed':''}"><div class="number">${escapeHTML(c.number)} · ${escapeHTML(c.kind)}</div><div class="symbol">${c.symbol}</div><div class="cardname">${escapeHTML(c.name)}</div><div class="cardmeta">${c.reversed?'逆位 REVERSED':'正位 UPRIGHT'}</div></div></div></div><div class="interpret"><h3>${escapeHTML(c.name)} · ${c.reversed?'逆位':'正位'}</h3><div class="keywords">${escapeHTML(c.reversed?c.rev:c.up)}</div><p>${escapeHTML(explain(c,positions[i]))}</p></div></article>`).join('');$('summary').innerHTML=`<strong>✦ 給你的整體提醒</strong><p>${question?`你問的是「${escapeHTML(question)}」。`:'針對你心中正在思考的事情，'}${count===1?`這張牌邀請你留意「${escapeHTML(picks[0].reversed?picks[0].rev:picks[0].up)}」。`:`這三張牌呈現了從「${escapeHTML(picks[0].reversed?picks[0].rev:picks[0].up)}」，經過「${escapeHTML(picks[1].reversed?picks[1].rev:picks[1].up)}」，走向「${escapeHTML(picks[2].reversed?picks[2].rev:picks[2].up)}」的反思脈絡。`}不必急著做出結論，請想想：你今天能採取的最小一步是什麼？</p>`;$('reading').classList.remove('hidden');$('status').textContent='牌卡已為你揭曉 ✦';picks.forEach((_,i)=>setTimeout(()=>$('tarot'+i)?.classList.add('revealed'),170+i*380));$('reading').scrollIntoView({behavior:'smooth',block:'start'})}
$('drawBtn').addEventListener('click',show);$('againBtn').addEventListener('click',show);
const storageKey='astra-tarot-history-v1';function getHistory(){try{return JSON.parse(localStorage.getItem(storageKey)||'[]')}catch{return []}}
$('saveBtn').addEventListener('click',()=>{if(!current)return;try{let a=getHistory();a.unshift(current);localStorage.setItem(storageKey,JSON.stringify(a.slice(0,30)));$('saveBtn').textContent='✓ 已儲存';setTimeout(()=>$('saveBtn').textContent='♡ 儲存本次解讀',1800)}catch{alert('瀏覽器目前無法儲存紀錄')}});
function renderHistory(){let a=getHistory();$('historyList').innerHTML=a.length?a.map(x=>`<div class="entry"><small>${escapeHTML(x.date)} · ${escapeHTML(x.topic)}</small><div>${x.picks.map(c=>`${escapeHTML(c.name)} (${c.reversed?'逆位':'正位'})`).join('、')}</div>${x.question?`<small>問題：${escapeHTML(x.question)}</small>`:''}</div>`).join(''):'目前還沒有紀錄。抽牌後按「儲存本次解讀」即可保留。'}
$('historyBtn').addEventListener('click',()=>{renderHistory();$('modal').classList.remove('hidden')});$('closeModal').addEventListener('click',()=>$('modal').classList.add('hidden'));$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').classList.add('hidden')});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('modal').classList.add('hidden')});$('clearHistory').addEventListener('click',()=>{if(confirm('確定清除所有本機占卜紀錄？')){localStorage.removeItem(storageKey);renderHistory()}});
</script></body></html>
